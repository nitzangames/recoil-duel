  <text x="565" y="1135" fill="#ffc857" font-family="Arial,sans-serif" font-size="24" font-weight="900">D  ARENA VIEW</text><text x="790" y="1135" fill="#8fa2aa" font-family="Arial,sans-serif" font-size="18">shows the room</text>
