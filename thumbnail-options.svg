  <rect width="1100" height="1160" fill="#0b1217"/>
  <text x="50" y="52" fill="#fffdf5" font-family="Arial,sans-serif" font-size="30" font-weight="800">Recoil Duel — thumbnail directions</text>
  <text x="50" y="85" fill="#8fa2aa" font-family="Arial,sans-serif" font-size="18">Option D is the current platform thumbnail</text>

  <!-- A: Crossfire -->
  <g transform="translate(35 115)">
