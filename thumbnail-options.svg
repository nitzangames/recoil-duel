  <g transform="translate(565 690)">
    <rect width="500" height="410" rx="34" fill="url(#dark)"/>
    <rect x="75" y="75" width="350" height="270" rx="16" fill="#eee4d2" stroke="#071014" stroke-width="12"/>
    <path d="M162 75v270M250 75v270M338 75v270M75 142h350M75 210h350M75 278h350" stroke="#10171d" stroke-width="2" opacity=".12"/>
