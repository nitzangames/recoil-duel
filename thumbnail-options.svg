  </g>
  <text x="35" y="650" fill="#ffc857" font-family="Arial,sans-serif" font-size="24" font-weight="900">A  CROSSFIRE</text><text x="225" y="650" fill="#8fa2aa" font-family="Arial,sans-serif" font-size="18">bold + gameplay-first</text>

  <!-- B: Impact Ring -->
  <g transform="translate(565 115)">
    <rect width="500" height="500" rx="34" fill="url(#dark)"/>
    <circle cx="250" cy="245" r="188" fill="none" stroke="#ffc857" stroke-width="18" opacity=".08"/><circle cx="250" cy="245" r="140" fill="none" stroke="#ffc857" stroke-width="16" opacity=".13"/><circle cx="250" cy="245" r="90" fill="none" stroke="#ffc857" stroke-width="14" opacity=".18"/>
