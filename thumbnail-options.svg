    <text x="250" y="484" text-anchor="middle" fill="#ffc857" stroke="#071014" stroke-width="7" paint-order="stroke" font-family="Impact,Arial Black,sans-serif" font-size="70">DUEL</text>
  </g>
  <text x="565" y="650" fill="#ffc857" font-family="Arial,sans-serif" font-size="24" font-weight="900">B  IMPACT RING</text><text x="790" y="650" fill="#8fa2aa" font-family="Arial,sans-serif" font-size="18">clean + graphic</text>

