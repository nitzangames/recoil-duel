    <text x="250" y="62" text-anchor="middle" fill="#fffdf5" stroke="#071014" stroke-width="7" paint-order="stroke" font-family="Impact,Arial Black,sans-serif" font-size="58">RECOIL</text>
    <text x="250" y="394" text-anchor="middle" fill="#ffc857" stroke="#071014" stroke-width="7" paint-order="stroke" font-family="Impact,Arial Black,sans-serif" font-size="66">DUEL</text>
