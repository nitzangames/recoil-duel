      <rect x="8" y="-25" width="130" height="50" rx="12" fill="#071014"/><rect x="17" y="-18" width="106" height="36" rx="8" fill="#087a98"/><rect x="31" y="-11" width="76" height="22" rx="5" fill="#28b8d6"/>
      <circle cx="131" r="10" fill="#071014"/><circle cx="131" r="5" fill="#5e747d"/><rect x="-45" y="-38" width="87" height="76" rx="19" fill="#28b8d6"/><circle cx="-5" r="29" fill="#087a98"/>
      <path d="M139 0l43-29-15 29 17 27z" fill="#ffc857"/>
