      <circle cx="131" r="10" fill="#071014"/><circle cx="131" r="5" fill="#5e747d"/><rect x="-45" y="-38" width="87" height="76" rx="19" fill="#ff5e53"/><circle cx="-5" r="29" fill="#b82f36"/>
      <path d="M139 0l43-29-15 29 17 27z" fill="#ffc857"/>
