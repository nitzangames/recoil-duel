    <use href="#blueGun" transform="translate(135 215) rotate(6) scale(.88)"/><use href="#redGun" transform="translate(373 260) rotate(186) scale(.88)"/>
    <text x="250" y="74" text-anchor="middle" fill="#fffdf5" stroke="#071014" stroke-width="7" paint-order="stroke" font-family="Impact,Arial Black,sans-serif" font-size="62">RECOIL</text>
    <text x="250" y="385" text-anchor="middle" fill="#ffc857" stroke="#071014" stroke-width="7" paint-order="stroke" font-family="Impact,Arial Black,sans-serif" font-size="70">DUEL</text>
  </g>
  <text x="35" y="1135" fill="#ffc857" font-family="Arial,sans-serif" font-size="24" font-weight="900">C  SPLIT RIVALS</text><text x="260" y="1135" fill="#8fa2aa" font-family="Arial,sans-serif" font-size="18">competitive</text>

