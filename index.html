<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="game-version" content="v0.1">
  <title>Recoil Duel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #10171d;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      display: block; width: 100%; height: 100%; max-width: 56.25vh; max-height: 177.78vw;
      object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: crosshair;
    }
  </style>
  <script src="https://nitzan.games/play-sdk.js"></script>
</head>
<body>
  <canvas id="game" width="1080" height="1920" role="application" aria-label="Recoil Duel. Tap to fire your spinning gun and land three hits."></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
